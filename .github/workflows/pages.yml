# Publishes the repo to GitHub Pages, as before, plus the built website.
#
#   https://rkdotxyz.github.io/DM2601/               the repo (README, presentation, prototype docs)
#   https://rkdotxyz.github.io/DM2601/presentation/  the deck
#   https://rkdotxyz.github.io/DM2601/website/       the Heart Doll customiser, built from website/
#   https://rkdotxyz.github.io/DM2601/app/           the phone app, with a simulated doll, built from prototype/app/
#
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same Jekyll build GitHub Pages ran before, so every existing URL keeps working.
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            prototype/app/package-lock.json
      - name: Build the website
        working-directory: website
        run: |
          npm ci
          npm run build

      # Swap Jekyll's copy of website/ (the source) for the built site.
      - name: Add the website to the site
        run: |
          sudo rm -rf _site/website
          sudo mkdir -p _site/website
          sudo cp -r website/dist/. _site/website/

      - name: Build the app demo
        working-directory: prototype/app
        run: |
          npm ci
          npm run build:demo

      # The app's demo build, with a simulated doll, at /app/. Jekyll's copy
      # of prototype/app/ (the source) is left out of the site.
      - name: Add the app demo to the site
        run: |
          sudo rm -rf _site/app _site/prototype/app
          sudo mkdir -p _site/app
          sudo cp -r prototype/app/dist/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
